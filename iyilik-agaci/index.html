<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3e8">
  <title>İyilik Ağacı | Birlikte İyilik Akademi</title>
  <meta name="description" content="İyilik ağacına dokunun, Birlikte İyilik Akademi bağlantılarını paylaşın. Etkinlikler ve buluşmalar için interaktif QR sunumu.">
  <link rel="canonical" href="https://birlikteiyilik.com/iyilik-agaci">
  <meta property="og:title" content="Bir iyilik, bin filiz. | Birlikte İyilik Akademi">
  <meta property="og:description" content="Ağaca dokun, iyiliği paylaş. Birlikte İyilik Akademi bağlantıları tek bir QR kodunda.">
  <meta property="og:image" content="https://birlikteiyilik.com/images/logo.png">
  <meta property="og:url" content="https://birlikteiyilik.com/iyilik-agaci">
  <link rel="icon" href="/images/favicon-square.png">
  <link rel="stylesheet" href="/css/qr-tree-v1.css">
  <script type="module" src="/js/qr-tree-v1.js"></script>
</head>
<body class="tree-presentation-page">
  <nav class="tree-presentation-nav" aria-label="Sayfa bağlantıları">
    <a class="tree-presentation-brand" href="/"><img src="/images/favicon-square.png" alt="" width="30" height="30"><span>Birlikte İyilik Akademi</span></a>
    <a href="https://birlikteiyilik.com/qr">Tüm bağlantılar</a>
  </nav>
  <main>
<section class="goodness-tree" data-goodness-tree data-tree-theme="filiz" data-view="qr" data-tree-presentation aria-labelledby="sunum-agaci-title">
  <div class="gt-copy">
    <p class="gt-eyebrow">İYİLİĞİ BİRLİKTE BÜYÜTÜYORUZ</p>
<h1 id="sunum-agaci-title">Bir iyilik, bin filiz.</h1>    <p>Ağaca dokunun, QR kodunu okutun. Eğitimden gönüllülüğe, iyiliğe açılan bütün yollar burada.</p>
    <a class="gt-destination" href="https://birlikteiyilik.com/qr">Bağlantılarımızı aç <span class="gt-arrow" aria-hidden="true"></span></a>
  </div>
  <div class="gt-experience">
    <div class="gt-topline">
      <span class="gt-badge">BİRLİKTE İYİLİK AĞACI</span>
    </div>
    <button class="gt-stage" type="button" aria-label="Birlikte İyilik bağlantılarının QR kodu" aria-pressed="true" disabled>
      <span class="gt-canvas" aria-hidden="true"></span>
      <span class="gt-qr"><img src="/assets/qr/birlikteiyilik-v1.svg" width="410" height="410" alt="https://birlikteiyilik.com/qr adresine yönlendiren QR kodu" loading="lazy"></span>
    </button>
    <div class="gt-controls">
      <button class="gt-toggle" type="button" hidden>QR kodunu göster <span class="gt-arrow" aria-hidden="true"></span></button>
      <a class="gt-download" href="/assets/qr/birlikteiyilik-v1.svg" download="Birlikte-Iyilik-QR.svg">QR indir <span aria-hidden="true">↓</span></a>
    </div>
    <p class="gt-hint" role="status" aria-live="polite">Telefon kameranızla okutun veya bağlantılarımızı açın.</p>
    <div class="gt-themes" role="group" aria-label="Ağacın teması" hidden>
      <button class="gt-theme" type="button" data-theme-choice="filiz" aria-pressed="true">Filiz</button>
      <button class="gt-theme" type="button" data-theme-choice="bahar" aria-pressed="false">Bahar</button>
      <button class="gt-theme" type="button" data-theme-choice="bereket" aria-pressed="false">Bereket</button>
    </div>
    <div class="gt-tools">
      <button class="gt-pause" type="button" aria-pressed="false" hidden>Hareketi durdur</button>
      <button class="gt-fullscreen" type="button" hidden>Tam ekran</button>
    </div>
  </div>
</section>  </main>
</body>
</html>
