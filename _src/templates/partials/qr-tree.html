<section class="goodness-tree{% if tree_compact %} goodness-tree--compact{% endif %}" data-goodness-tree data-tree-theme="{{ tree_theme }}" data-view="qr"{% if tree_presentation %} data-tree-presentation{% endif %} aria-labelledby="{{ tree_id }}-title">
  <div class="gt-copy">
    <p class="gt-eyebrow">{{ tree_eyebrow }}</p>
    {% if tree_presentation %}<h1 id="{{ tree_id }}-title">{{ tree_title }}</h1>{% else %}<h2 id="{{ tree_id }}-title">{{ tree_title }}</h2>{% endif %}
    <p>{{ tree_description }}</p>
    <a class="gt-destination" href="https://birlikteiyilik.com/qr">Bağlantılarımızı aç <span class="gt-arrow" aria-hidden="true"></span></a>
  </div>
  <div class="gt-experience">
    <div class="gt-topline">
      <span class="gt-badge">BİRLİKTE İYİLİK AĞACI</span>
      {% if not tree_presentation %}<a class="gt-presentation" href="/iyilik-agaci">Sunum ekranı <span class="gt-arrow" aria-hidden="true"></span></a>{% endif %}
    </div>
    <button class="gt-stage" type="button" aria-label="Birlikte İyilik bağlantılarının QR kodu" aria-pressed="true" disabled>
      <span class="gt-canvas" aria-hidden="true"></span>
      <span class="gt-qr"><img src="/assets/qr/birlikteiyilik-v1.svg" width="410" height="410" alt="https://birlikteiyilik.com/qr adresine yönlendiren QR kodu" loading="lazy"></span>
    </button>
    <div class="gt-controls">
      <button class="gt-toggle" type="button" hidden>QR kodunu göster <span class="gt-arrow" aria-hidden="true"></span></button>
      <a class="gt-download" href="/assets/qr/birlikteiyilik-v1.svg" download="Birlikte-Iyilik-QR.svg">QR indir <span aria-hidden="true">↓</span></a>
    </div>
    <p class="gt-hint" role="status" aria-live="polite">Telefon kameranızla okutun veya bağlantılarımızı açın.</p>
    <div class="gt-themes" role="group" aria-label="Ağacın teması" hidden>
      <button class="gt-theme" type="button" data-theme-choice="filiz" aria-pressed="{{ 'true' if tree_theme == 'filiz' else 'false' }}">Filiz</button>
      <button class="gt-theme" type="button" data-theme-choice="bahar" aria-pressed="{{ 'true' if tree_theme == 'bahar' else 'false' }}">Bahar</button>
      <button class="gt-theme" type="button" data-theme-choice="bereket" aria-pressed="{{ 'true' if tree_theme == 'bereket' else 'false' }}">Bereket</button>
    </div>
    <div class="gt-tools">
      <button class="gt-pause" type="button" aria-pressed="false" hidden>Hareketi durdur</button>
      <button class="gt-fullscreen" type="button" hidden>Tam ekran</button>
    </div>
  </div>
</section>
